# Keeps the front page fresh without waiting for a reader.
#
# The page is ISR with a 900-second window, and on Vercel an expired page is
# only regenerated when a request arrives: the first reader after a quiet spell
# gets the stale copy (a 55-hour-old page was observed on the previous host)
# and their visit triggers the regeneration. This scheduled request is that
# reader, every 5 minutes, so a reader sees an edition that is usually about 20
# minutes old. Requests while the page is fresh are cache hits and cost nothing
# upstream; only the first one after expiry causes the single crawl the
# snapshot already does.
#
# Only `/` is requested. The feed routes read the same cached edition
# (`getSnapshot` in `src/lib/snapshot.ts`), so keeping `/` fresh keeps their
# edition fresh too.
#
# GitHub can run schedules late or skip runs, and it disables scheduled
# workflows in a public repository after 60 days without repository activity.
# An external monitor (UptimeRobot) therefore also requests `/` every 5 minutes,
# because GitHub schedules are best-effort and delivered about 1% of the `*/5`
# runs when measured; this workflow stays as a backup.
#
# Failure policy: a failed request is retried and warned about on every run,
# but fails the job only for a run that starts in the first five minutes of a
# UTC hour, so an outage sends at most about one failure email an hour.
name: Warm front page

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: warm-front-page
  cancel-in-progress: false

jobs:
  warm:
    if: github.repository == 'mfkocalar/havadis'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_URL: https://havadis-news.vercel.app
    steps:
      - name: Request the front page
        run: |
          START_MINUTE=$(date -u +%M)
          RESULT=$(curl --silent --show-error --max-time 60 --retry 2 --retry-delay 10 \
            --user-agent "HavadisRefresh/1.0 (GitHub Actions schedule)" \
            --output /dev/null \
            --write-out '%{http_code} age=%header{age} cache=%header{x-vercel-cache}' \
            "${SITE_URL%/}/") || RESULT="curl failed"
          echo "refresh ${SITE_URL%/}/ -> $RESULT" | tee -a "$GITHUB_STEP_SUMMARY"
          case "$RESULT" in 200*) exit 0 ;; esac
          echo "::warning::front page refresh failed: $RESULT"
          if [ "$START_MINUTE" -lt 5 ]; then exit 1; fi
          exit 0
