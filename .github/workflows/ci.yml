name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: https://havadis-news.vercel.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # The build prerenders from the committed fixture edition (no feed, KEV,
      # EPSS or CVE Program request). The switch is set on this step only,
      # because npm test must not see it.
      - run: npm run build
        env:
          HAVADIS_FIXTURE_EDITION: "1"
      - run: npm test

  viewports:
    name: Viewport check at six widths (fixture edition)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_URL: https://havadis-news.vercel.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run build
        env:
          HAVADIS_FIXTURE_EDITION: "1"
      - run: node scripts/verify-viewports.mjs
        env:
          HAVADIS_FIXTURE_EDITION: "1"
